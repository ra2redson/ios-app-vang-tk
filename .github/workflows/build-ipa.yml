name: Build Unsigned IPA for TrollStore

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Init Capacitor & Add iOS
        run: |
          mkdir -p www && echo "<h1>Loading...</h1>" > www/index.html
          npm install
          npm install @capacitor/assets --save-dev
          npx cap add ios
          npx capacitor-assets generate --assetPath icon.png
          cd ios/App && pod install

      - name: Build Xcode Archive (Unsigned)
        run: |
          cd ios/App
          pod install
          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package into IPA
        run: |
          mkdir -p Payload
          # Trỏ trực tiếp vào thư mục build mặc định của DerivedData trên GitHub Actions runner
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "App.app" -type d | head -n 1)
          
          if [ -z "$APP_PATH" ]; then
            echo "Lỗi: Không tìm thấy file App.app!"
            exit 1
          fi
          
          echo "Tìm thấy app tại: $APP_PATH"
          cp -r "$APP_PATH" Payload/
          zip -r App.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyWebViewApp-IPA
          path: App.ipa
